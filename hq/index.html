    if(!DOCS['trabajos/'+n.id])await col('trabajos').set(n.id,{titulo,tipo:n.tipo,clienteId:c?cid:'',proyecto:n.para==='vito'||VITO()?'Vitoreando':'',estado:c?'Pendiente de propuesta':'En preparación',
      responsable:n.responsable,equipo:n.responsable?[n.responsable]:[],fechaInicio:'',fechaEntrega:n.fecha,descripcion:'',creado:now,creadoPor:ME||'',historial:[{t:now,por:ME||'',que:'Creado'}]});
    NT=null;ls.set('nt',null);
    if(c){if(!S.presupuestos.some(p=>p.id===n.pid)){PQ=nuevoPresu(n.tipo,tarifa(),{titulo,clienteId:cid,clienteNombre:cn,trabajoId:n.id});PQ.id=n.pid;PSTEP=2;PV='caja';await presuGuardar(false)}
      TPED=true;ls.set('tped',true);abrirTrabajo(n.id,'presu');toast('Trabajo creado. Ahora ajusta el presupuesto')}
    else{abrirTrabajo(n.id,'resumen');toast('Trabajo creado')}}
  catch(e){if(e.code!=='login')toast(e.message||'No se pudo crear. Revisa la conexión');render()}
  finally{NTBUSY=false}}

/* ---------- acciones de un trabajo ---------- */
function trabEstado(id,v){const T=find('trabajos',id);if(!T||T.estado===v)return;
  W(()=>col('trabajos').update(id,{estado:v,actualizado:Date.now(),historial:[...(T.historial||[]),{t:Date.now(),por:ME||'',que:'Estado: '+v}].slice(-60)}),'Estado: '+v)}
function trabPresu(tid,pid){let p=pid&&S.presupuestos.find(x=>x.id===pid);const T=find('trabajos',(p&&p.trabajoId)||tid);
  if(!p&&T)p=trabRel(T,S).vigente;
  if(p){PQ=JSON.parse(JSON.stringify(p));PSTEP=p.estado==='borrador'?2:4}
  else if(T){const tipo=PLANTILLAS[T.tipo]||(tarifa().plantillas||{})[T.tipo]?T.tipo:'custom';PQ=nuevoPresu(tipo,tarifa(),{titulo:T.titulo,clienteId:T.clienteId||'',clienteNombre:cliNombre(T.clienteId),trabajoId:T.id});PSTEP=2}
  else return;
  PV='caja';TPED=true;psave();ls.set('tped',true);if(T)abrirTrabajo(T.id,'presu');else navegar(()=>{TAB='clientes';ls.set('tab',TAB);SUB.cli='presu';ls.set('sub',SUB)},true)}
// Programar una sesión del alcance: si ya existe esa grabación, se abre en vez de crear otra.
function trabSesion(tid,i){const T=find('trabajos',tid);if(!T)return;const R=trabRel(T,S),ya=i>=0&&R.eventos.find(e=>e.tipo==='Grabación'&&+e.sesion===i);
  if(ya){openForm('eventos',ya);return}const s=i>=0&&(alcanceDe(R.acept)||{sesiones:[]}).sesiones[i];
  openForm('eventos',null,{tipo:'Grabación',titulo:'Grabación · '+T.titulo,trabajoId:T.id,proyecto:T.proyecto||'',...(i>=0?{sesion:i}:{}),lugar:s?(s.lugar==='estudio'?'Estudio de Crazy Estudio':s.lugarTxt||''):''})}
// Con facturas ya hechas no hay versión nueva: así nunca se factura dos veces lo mismo entre versiones.
const facturasDe=pid=>S.facturas.filter(f=>f.presupuestoId===pid&&f.estado!=='anulada'&&f.tipo!=='proforma');
function nuevaVersion(pid){const p=S.presupuestos.find(x=>x.id===pid);if(!p)return;
  if(facturasDe(pid).length){toast('Este presupuesto ya tiene facturas: para cambiar el importe, habla con quien factura (rectificativa o factura aparte)');return}const c=JSON.parse(JSON.stringify(p));
  ['id','creado','creadoPor','calc','aceptada','estadoDesde','sustituidoPor','copiado','actualizado','actualizadoPor'].forEach(k=>delete c[k]);
  c.versiones=[];c.estado='borrador';c.versionDe=p.id;c.version=(p.version||1)+1;PQ=c;PSTEP=2;PV='caja';TPED=true;psave();ls.set('tped',true);
  toast('Versión '+c.version+' en borrador. La aceptada no cambia');
  if(p.trabajoId&&find('trabajos',p.trabajoId))abrirTrabajo(p.trabajoId,'presu');else navegar(()=>{TAB='clientes';ls.set('tab',TAB);SUB.cli='presu';ls.set('sub',SUB)},true)}
// Paso 6: de una propuesta a un trabajo, sin volver a escribir cliente, alcance ni entregables.
function trabDesdePresu(pid){const p=S.presupuestos.find(x=>x.id===pid);if(!p)return;if(p.trabajoId&&find('trabajos',p.trabajoId)){abrirTrabajo(p.trabajoId,'resumen');return}
  const id='t'+pid.replace(/[^A-Za-z0-9_-]/g,'').slice(0,60),now=Date.now(),cn=p.clienteNombre||cliNombre(p.clienteId);
  W(async()=>{if(!DOCS['trabajos/'+id])await col('trabajos').set(id,{titulo:[p.plantilla&&p.plantilla.n||'Trabajo',cn].filter(Boolean).join(' · '),tipo:p.tipo||'custom',clienteId:p.clienteId||'',proyecto:'',
      estado:estadoTrasPresu('Borrador',p.estado||'borrador'),responsable:'',equipo:[],fechaInicio:'',fechaEntrega:'',descripcion:'',creado:now,creadoPor:ME||'',historial:[{t:now,por:ME||'',que:'Creado desde el presupuesto'}]});
    await col('presupuestos').update(pid,{trabajoId:id});if(PQ&&PQ.id===pid){PQ.trabajoId=id;psave()}abrirTrabajo(id,'resumen')},'Trabajo creado con lo acordado. Falta elegir responsable')}
// Después de guardar un presupuesto: el trabajo y el cliente reflejan su estado (solo hacia delante).
async function trasPresu(P,prev){
  if(P.estado==='aceptado'&&P.versionDe){const o=S.presupuestos.find(x=>x.id===P.versionDe);if(o&&!o.sustituidoPor)await col('presupuestos').update(o.id,{sustituidoPor:P.id})}
  if(prev&&prev.estado===P.estado)return;
  const T=P.trabajoId&&find('trabajos',P.trabajoId);
  if(T){const nx=estadoTrasPresu(T.estado,P.estado);if(nx!==T.estado)await col('trabajos').update(T.id,{estado:nx,actualizado:Date.now(),historial:[...(T.historial||[]),{t:Date.now(),por:ME||'',que:'Estado: '+nx+' (por el presupuesto)'}].slice(-60)})}
  const C=P.clienteId&&find('clientes',P.clienteId);
  if(C){const nc=P.estado==='enviado'&&C.estado==='Contacto'?'Propuesta enviada':P.estado==='aceptado'&&['Contacto','Propuesta enviada','Negociando'].includes(C.estado)?'En curso':'';
    if(nc)await col('clientes').update(C.id,{estado:nc,...(nc==='Propuesta enviada'?{siguiente:'Preguntar si le encaja la propuesta',fechaSiguiente:addDays(todayISO(),3)}:{}),actualizado:Date.now()})}}
const presuBloq=P=>{const s=P&&P.id&&S.presupuestos.find(x=>x.id===P.id);return !!(s&&(s.aceptada||s.estado==='aceptado'))};

  <ul class="lst"><li>Se guarda tal cual: partidas, precios, descuento, condiciones y mensaje.</li><li>Ya no se podrá cambiar ni borrar. Para cambiar algo harás una <b>versión nueva</b> y esta se conserva.</li>${PQ.trabajoId?'<li>El trabajo pasa a «Aceptado».</li>':''}<li>Aceptado no confirma la disponibilidad: revísala en la agenda.</li></ul>

async function canalImport(file){const msg=$('#cImpMsg'),say=t=>{if(msg)msg.textContent=t};
  let j;try{j=JSON.parse(await file.text())}catch{say('Ese archivo no es el plan. Elige plan-canal.json');return}
  const docs=j&&j.formato==='crazy-canal-plan'&&j.docs;if(!docs){say('Ese archivo no es el plan. Elige plan-canal.json');return}
  const ids=Object.keys(docs).filter(k=>/^[A-Za-z0-9_\-.]{1,70}$/.test(k));say('Guardando 0 de '+ids.length+'…');
  ids.forEach(k=>{DOCS['mio/'+CP+k]={col:'mio',id:CP+k,data:docs[k]}});persist();
  let n=0,mal=0,q=ids.slice();const una=async()=>{while(q.length){const k=q.shift();try{await api('put',{col:'mio',id:CP+k,data:docs[k]})}catch(e){mal++}n++;say('Guardando '+n+' de '+ids.length+'…')}};
  await Promise.all([una(),una(),una(),una()]);
  SINCE=0;await sync();rebuild();render();toast(mal?'Faltan '+mal+' por guardar. Vuelve a importar el archivo':'Plan importado: '+ids.length+' elementos',null,mal?'':'ok')}
document.addEventListener('change',e=>{if(e.target.id==='cImport'&&e.target.files[0])canalImport(e.target.files[0])});

// Números que cuentan: al entrar por primera vez desde cero; cuando cambian, del valor anterior al nuevo. En el total del presupuesto, una burbuja dice cuánto ha subido o bajado.
function animNum(el,desde,hasta,p,dur){if(el._na)cancelAnimationFrame(el._na);const t0=performance.now(),fin=el.textContent;
  const paso=t=>{if(!el.isConnected)return;const k=(t-t0)/dur;if(k>=1){el.textContent=fin;el._na=0;return}el.textContent=fmtNum(numEn(desde,hasta,k,p.dec),p.dec,p.cur);el._na=requestAnimationFrame(paso)};el._na=requestAnimationFrame(paso)}
function burbuja(el,dif,p){const tt=el.closest('.tt')||el.parentElement;if(!tt)return;tt.querySelectorAll('.delta').forEach(x=>x.remove());const s=document.createElement('span');
  s.className='delta '+(dif>0?'up':'down');s.setAttribute('aria-hidden','true');s.textContent=(dif>0?'+':'−')+fmtNum(Math.abs(dif),p.dec,p.cur);tt.appendChild(s);setTimeout(()=>s.remove(),1300)}
function numeros(vk){const entra=VK_ENTRA;VK_ENTRA=false;
  document.querySelectorAll('#view [data-num],#view .pbar .tt b').forEach(el=>{const key=vk+'|'+(el.dataset.num||'total'),p=parseNum(el.textContent);if(!p){NUMS.delete(key);return}
    const prev=NUMS.get(key);NUMS.set(key,p.v);if(!motionOK())return;
    if(prev==null){if(entra&&el.dataset.num&&p.v&&!CONTADOS.has(key)){CONTADOS.add(key);animNum(el,0,p.v,p,750)}return}
    if(prev!==p.v){animNum(el,prev,p.v,p,520);if(el.closest('.pbar'))burbuja(el,p.v-prev,p)}})}
function popSi(el,antes){if(!el||el.hidden||!motionOK()||el.textContent===antes)return;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
// Acceso: al entrar, la pantalla de acceso se abre hacia la app.
function cerrarLogin(){const l=$('#login');if(!motionOK()){l.hidden=true;return}l.classList.add('out');setTimeout(()=>{l.hidden=true;l.classList.remove('out')},380)}
// Escritorio: un brillo suave sigue al cursor sobre las tarjetas.
if(matchMedia('(hover:hover) and (pointer:fine)').matches){let raf=0,x=0,y=0,tg=null;
  document.addEventListener('pointermove',e=>{tg=e.target&&e.target.closest&&e.target.closest('.hc,.card.trab,.menu button,.bqr');x=e.clientX;y=e.clientY;
    if(!raf&&tg)raf=requestAnimationFrame(()=>{raf=0;if(!tg||!tg.isConnected)return;const r=tg.getBoundingClientRect();tg.style.setProperty('--mx',(x-r.left)+'px');tg.style.setProperty('--my',(y-r.top)+'px')})},{passive:true})}
// REC: el código de tiempo del visor corre a 25 imágenes por segundo (solo en Hoy y con el estilo REC).
{let el=null,ult=0;const p2=n=>String(n).padStart(2,'0');
  const tick=t=>{requestAnimationFrame(tick);if(t-ult<40)return;ult=t;if(!el||!el.isConnected)el=document.getElementById('tcode');if(!el||!motionOK()||EST()!=='rec')return;
    const d=new Date();el.textContent=`${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}:${p2(Math.floor(d.getMilliseconds()/40))}`};
  requestAnimationFrame(tick)}
// Mientras carga: esqueletos con brillo.
function skel(n){return Array.from({length:n},(_,i)=>`<div class="skel" aria-hidden="true" style="--i:${i}"><i></i><i></i><i></i></div>`).join('')+'<span class="sr">Cargando…</span>'}

    case 'gsave':{const f=$('#gForm');api('g_config',{client_id:f.cid.value,client_secret:f.sec.value}).then(()=>{toast('Guardado. Ahora conecta la cuenta');sync()}).catch(e=>toast(e.message));break}

    case 'gdisc':if(!a.dataset.ok){a.dataset.ok=1;a.textContent='Pulsa otra vez para desconectar';break}api('g_desconectar',{}).then(()=>{toast('Google desconectado');sync()}).catch(e=>toast(e.message));break;
    case 'mail':{const v=$('#myMail').value.trim();api('setemail',{email:v}).then(()=>{MYEMAIL=v;toast(v?'Gmail guardado: te llegarán las reuniones':'Gmail quitado');sync()}).catch(e=>toast(e.message));break}
    case 'portal':{const c=find('clientes',id);api('portal_alta',{cliente_id:id}).then(r=>{PORTAL[id]=r.usuario;ls.set('portal',PORTAL);render();
      shareSheet(`Hola${c.nombre?' '+c.nombre:''}! 👋 Ya podéis seguir en directo cómo va vuestro proyecto con Crazy Estudio:\n\n🔗 ${r.url}\n👤 Usuario: ${r.usuario}\n🔑 Clave: ${r.clave}\n\nLa primera vez os pedirá cambiar la clave. Ahí veréis en qué punto está cada pieza (guion, grabación, edición, publicación…) y quién está con ella, sin tener que preguntar.`,'Acceso al portal · '+c.nombre)}).catch(e=>toast(e.message||'No se pudo crear el acceso'));break}

    case 'push':enablePush();break;

    case 'qc':{const qi=$('#qcIn');const keep=qi?qi.value:'';QC[a.dataset.k]=a.dataset.v;ls.set('qc',QC);render();const n=$('#qcIn');if(n)n.value=keep;break}

    case 'asist':{if(!ME){whoSheet();break}const ev=find('eventos',id);const nv=(ev.asistencia||{})[ME]===a.dataset.v?null:a.dataset.v;W(()=>col('eventos').update(id,{asistencia:{[ME]:nv}}),nv==='si'?'Apuntado':null);break}
    case 'tarea':{const t=find('tareas',id);const run=()=>W(()=>col('tareas').update(id,{hecho:!t.hecho,hechoPor:ME||'',actualizado:Date.now()})).then(()=>{if(!t.hecho)toast('¡Hecha!',()=>W(()=>col('tareas').update(id,{hecho:false,actualizado:Date.now()})),'ok')});
      const row=a.closest('.task');if(!t.hecho&&row&&!matchMedia('(prefers-reduced-motion:reduce)').matches){row.classList.add('doing');setTimeout(run,560)}else run();break}
    case 'delpunto':{const ev=find('eventos',id);const p=(ev.puntos||[])[+a.dataset.i];if(!p)break;let quitado=false;W(()=>col('eventos').update(id,{puntos:(ev.puntos||[]).filter(x=>quitado||!(x.texto===p.texto&&x.autor===p.autor)||!(quitado=true))}));break}
    case 'etapa':{const c=find('contenido',id);const i=Math.min(ETAPAS.length-1,Math.max(0,ETAPAS.indexOf(c.etapa||'Idea')+ +a.dataset.d));W(()=>col('contenido').update(id,{etapa:ETAPAS[i]}),ETAPAS[i]);break}
    case 'plat':{const c=find('contenido',id);const p=a.dataset.v;let pe=(c.publicadoEn||[]).slice();pe=pe.includes(p)?pe.filter(x=>x!==p):[...pe,p];const all=(c.plataformas||[]).every(x=>pe.includes(x));W(()=>col('contenido').update(id,{publicadoEn:pe,...(all?{etapa:'Publicado'}:{})}),all?'Publicado en todas':'Subido a '+p);break}
    case 'votar':{if(!ME){whoSheet();break}const v=find('votaciones',id);W(()=>col('votaciones').update(id,{votos:{[ME]:a.dataset.v}}),'Voto guardado');break}
    case 'cerrarvot':{const v=find('votaciones',id);W(()=>col('votaciones').update(id,{cerrada:!v.cerrada}));break}
    case 'pasar':W(()=>col('material').update(id,{tiene:a.dataset.v}),'Ahora lo tiene '+a.dataset.v);break;
    case 'nudge':shareSheet(nudgeText(a.dataset.v),'Recordar a '+a.dataset.v,{act:'pushnudge',v:a.dataset.v,label:'Mandar aviso a su móvil'});break;
    case 'nudgeev':{const ev=find('eventos',id);const f=quienes(ev).filter(n=>!(ev.asistencia||{})[n]);shareSheet(`${f.join(', ')}: ¿venís a "${ev.titulo}" (${fDate(ev.fecha).toLowerCase()}${ev.hora?' '+ev.hora:''})? Confirmad con un toque aquí 👉 ${APP_URL}`,'Avisar a los que faltan',{act:'pushnudgeev',v:id,label:'Avisar en sus móviles'});break}
    case 'summary':shareSheet(groupSummary(),'Resumen para el grupo');break;
    case 'copyurl':copy(APP_URL,'Enlace copiado');break;
    case 'presu':{const c=find('clientes',id);P.cliente=c.nombre;const pk=cfg().packs.find(p=>c.servicio==='Pack '+p.nombre);if(pk)P.pack=pk.nombre;ls.set('presu',P);SUB.cli='presu';ls.set('sub',SUB);render();window.scrollTo(0,0);break}
    case 'copypresu':shareSheet(presuCalc().txt,'Presupuesto'+(P.cliente?' · '+P.cliente:''));break;
    case 'presu2cli':{const r=presuCalc();if(!P.cliente){toast('Pon el nombre del cliente');break}const ex=S.clientes.find(c=>c.nombre.toLowerCase()===P.cliente.toLowerCase());
      const patch={estado:'Propuesta enviada',servicio:'Pack '+r.pk.nombre,importe:Math.round(r.mes*100)/100,siguiente:'Preguntar si le encaja la propuesta',fechaSiguiente:addDays(todayISO(),3),actualizado:Date.now()};
      W(()=>ex?col('clientes').update(ex.id,patch):col('clientes').add({nombre:P.cliente,contacto:'',notas:'',creado:Date.now(),creadoPor:ME||'',...patch}),'Guardado en clientes');break}

    case 'nograbado':W(()=>col('eventos').update(id,{resultado:'no'}),'Apuntado: no se hizo');break;

    case 'calcopy':copy(a.dataset.v,'Enlace copiado');break;
    case 'calnew':calSheet(true);break;

});
document.addEventListener('submit',async e=>{if(e.target.id!=='addUser')return;e.preventDefault();const n=e.target.n.value.trim();if(!n)return;try{await api('adduser',{nombre:n,rol:e.target.r.value});await loadTeam();render();toast(n+' añadido. Ponle un PIN')}catch(er){toast(er.message||'No se pudo añadir')}});
